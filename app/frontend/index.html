<main><header><div><h1 id="page-title">总览</h1><p id="page-subtitle">一眼看清今天该做什么</p></div><div class="header-right"><div id="account-switcher"></div><span class="update">数据更新至 <b id="data-date">—</b></span><button class="icon-btn" title="刷新数据" onclick="refreshAll()">↻</button></div></header><section id="content"></section></main>
<dialog id="money-dialog"><form id="money-form" novalidate><button type="button" class="icon-btn modal-close" data-close="money-dialog" aria-label="关闭" title="关闭">×</button><h2 id="form-title">新增资金</h2><p class="modal-subtitle">记录一笔新到账资金</p><label>金额（元）<input id="form-amount" type="text" inputmode="decimal" autocomplete="off" aria-describedby="form-amount-error"><small class="field-error" id="form-amount-error"></small></label><label id="cleared-wrap">到账日期与时间<input id="form-cleared" type="datetime-local" aria-describedby="form-cleared-error"><small class="field-error" id="form-cleared-error"></small></label><label>备注（可选）<input id="form-note" maxlength="100"></label><p class="form-hint" id="form-hint"></p><div class="modal-footer"><button type="button" class="secondary" data-close="money-dialog">取消</button><button type="submit" class="primary" id="form-submit">确认记录</button></div></form></dialog>
<dialog id="initialize-dialog"><form id="initialize-form" data-import-mode="false" novalidate><button type="button" class="icon-btn modal-close" data-close="initialize-dialog" aria-label="关闭" title="关闭">×</button><h2 id="initialize-title">建立账户</h2><div id="init-strategy-wrap"><label>准备投入策略的资金（元）<input id="init-strategy" type="text" inputmode="decimal" autocomplete="off"><small class="field-error" id="init-strategy-error"></small></label><label>另外保留的备用现金（元，可选）<input id="init-reserve" type="text" inputmode="decimal" value="0"><small class="field-error" id="init-reserve-error"></small></label><p class="form-hint">准备投入的资金会先进入待配置资金，不会立即买基金。系统会在下一次正式月度调仓时告诉你应买多少。</p></div><div id="init-import-fields" hidden><label>基金代码<select id="init-fund-code"><option value="007801">007801 大成中证红利指数C</option><option value="090010">090010 大成中证红利指数A</option><option value="009051">009051 易方达中证红利ETF联接A</option><option value="009052">009052 易方达中证红利ETF联接C</option><option value="012643">012643 招商中证红利ETF联接A</option><option value="012644">012644 招商中证红利ETF联接C</option><option value="016363">016363 招商中证红利ETF联接E</option></select></label><label>基金当前市值（元）<input id="init-fund-value" type="text" inputmode="decimal"></label><label>基金份额（可选）<input id="init-shares" type="text" inputmode="decimal"></label><label>策略现金（元）<input id="init-cash" type="text" inputmode="decimal"></label><label>待配置资金（元）<input id="init-pending" type="text" inputmode="decimal"></label><label>备用现金（元）<input id="init-reserve-import" type="text" inputmode="decimal"></label></div><label>备注（可选）<input id="init-note" maxlength="100"></label><div class="modal-footer"><button type="button" class="secondary" data-close="initialize-dialog">取消</button><button type="submit" class="primary" id="initialize-submit">建立账户</button></div></form></dialog>
<dialog id="confirm-dialog"><form id="confirm-form" novalidate><button type="button" class="icon-btn modal-close" data-close="confirm-dialog" aria-label="关闭" title="关闭">×</button><h2 id="confirm-title">请确认</h2><p id="confirm-message" class="modal-subtitle"></p><div class="modal-footer"><button type="button" class="secondary" data-close="confirm-dialog">取消</button><button type="submit" class="primary">确认</button></div></form></dialog>
<dialog id="execution-dialog"><form id="execution-form" novalidate><button type="button" class="icon-btn modal-close" data-close="execution-dialog" aria-label="关闭" title="关闭">×</button><h2>记录基金平台订单</h2><p class="modal-subtitle" id="execution-summary"></p><label id="execution-amount-label"><span id="execution-amount-title">平台实际扣款总额</span><input id="execution-amount" type="text" inputmode="decimal"><small id="execution-amount-help" class="form-hint">包含申购本金和已知费用；可与建议金额不同。</small><small id="execution-amount-error" class="field-error"></small></label><label id="execution-fee-wrap">已知费用（可留空，确认时补充）<input id="execution-fee" type="text" inputmode="decimal"><small id="execution-fee-error" class="field-error"></small></label><label id="execution-estimate-wrap" hidden>预计赎回金额（仅作估算）<input id="execution-estimate" type="text" inputmode="decimal"><small id="execution-estimate-error" class="field-error"></small></label><label>记录日期与时间<input id="execution-at" type="datetime-local"><small id="execution-at-error" class="field-error"></small></label><label>实际基金<select id="execution-fund"></select></label><label>备注（可选）<textarea id="execution-note" rows="3"></textarea></label><div class="modal-footer"><button type="button" class="secondary" data-close="execution-dialog">取消</button><button type="submit" class="primary" id="execution-submit">记录订单，等待确认</button></div></form></dialog>
<dialog id="order-confirm-dialog"><form id="order-confirm-form" novalidate><button type="button" class="icon-btn modal-close" data-close="order-confirm-dialog" aria-label="关闭" title="关闭">×</button><h2>确认基金订单结果</h2><p class="modal-subtitle" id="order-confirm-summary"></p><label>确认 NAV<input id="confirm-nav" type="text" inputmode="decimal"></label><label>确认份额<input id="confirm-units" type="text" inputmode="decimal"></label><label>确认本金 / 赎回总额<input id="confirm-principal" type="text" inputmode="decimal"></label><label>确认费用<input id="confirm-fee" type="text" inputmode="decimal" value="0"></label><label>基金确认价值 / 实际赎回款<input id="confirm-value" type="text" inputmode="decimal"></label><label>平台订单号（可选）<input id="confirm-reference" maxlength="80"></label><div class="modal-footer"><button type="button" class="secondary" id="order-confirm-correct">修正原订单</button><button type="button" class="secondary" data-close="order-confirm-dialog">取消</button><button type="submit" class="primary" id="order-confirm-submit">保存确认结果</button></div></form></dialog>
<dialog id="pending-action-dialog"><form id="pending-action-form" novalidate><button type="button" class="icon-btn modal-close" data-close="pending-action-dialog" aria-label="关闭" title="关闭">×</button><h2 id="pending-action-title">撤销待配置资金</h2><p class="modal-subtitle" id="pending-action-summary"></p><label>本次金额<input id="pending-action-amount" type="text" inputmode="decimal"><small id="pending-action-amount-error" class="field-error"></small></label><label>原因（可选）<textarea id="pending-action-reason" rows="3"></textarea></label><div class="modal-footer"><button type="button" class="secondary" data-close="pending-action-dialog">取消</button><button type="submit" class="primary" id="pending-action-submit">确认</button></div></form></dialog>
<dialog id="account-create-dialog"><form id="account-create-form" novalidate><button type="button" class="icon-btn modal-close" data-close="account-create-dialog" aria-label="关闭" title="关闭">×</button><h2>新建投资账户</h2><p class="modal-subtitle">新账户从空白账本开始，不复制其他账户的资产或流水。</p><label>账户名称<input id="account-create-name" maxlength="80" autocomplete="off" required aria-required="true"></label><label>说明（可选）<textarea id="account-create-description" rows="3" maxlength="200" placeholder="例如：长期投资或个人养老金"></textarea><small class="form-hint">说明仅用于本次创建确认，不会写入账户账本。</small></label><label>账户类型<select id="account-create-type"><option value="NORMAL">普通投资账户</option><option value="PENSION">个人养老金账户</option></select></label><p class="form-hint">仅当该账户实际通过个人养老金资金账户或个人养老金基金渠道执行时选择“个人养老金账户”。</p><div class="modal-footer"><button type="button" class="secondary" data-close="account-create-dialog">取消</button><button type="submit" class="primary">创建</button></div></form></dialog>
